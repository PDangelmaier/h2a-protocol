name: db-verify

on:
  pull_request:
    branches: [main]

jobs:
  db-verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for supabase changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^supabase/'; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No supabase/ changes — skipping db-verify."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Start PostgreSQL
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          docker run -d --name pg-verify \
            -e POSTGRES_DB=h2a_verify \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=verify_pass \
            -p 5432:5432 \
            --health-cmd "pg_isready -U postgres -d h2a_verify" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            pgvector/pgvector:pg16
          until docker inspect --format='{{.State.Health.Status}}' pg-verify | grep -q healthy; do sleep 2; done

      - name: Setup Supabase stubs
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          PGPASSWORD=verify_pass psql -h localhost -U postgres -d h2a_verify -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS vector;
          DO $$ BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END $$;

          -- G1: Replicate Supabase default grants so that RLS (not missing GRANTs)
          -- is what blocks anon/authenticated access.
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;
          GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;
          GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA public TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT EXECUTE ON FUNCTIONS TO anon, authenticated, service_role;

          -- service_role bypasses RLS (Supabase default)
          ALTER ROLE service_role SET "request.jwt.claim.role" = 'service_role';

          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid AS $f$
            SELECT '00000000-0000-0000-0000-000000000000'::uuid;
          $f$ LANGUAGE sql STABLE;
          SQL

      - name: Run migrations
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          FAIL=0
          for migration in $(ls supabase/migrations/*.sql | sort); do
            fname=$(basename "$migration")
            if PGPASSWORD=verify_pass psql -h localhost -U postgres -d h2a_verify -v ON_ERROR_STOP=1 -1 < "$migration" >/dev/null 2>&1; then
              echo "  ok   $fname"
            else
              echo "  FAIL $fname"
              PGPASSWORD=verify_pass psql -h localhost -U postgres -d h2a_verify -v ON_ERROR_STOP=1 -1 < "$migration" 2>&1 | grep -i "error\|hint" | head -3 || true
              FAIL=$((FAIL + 1))
            fi
          done
          if [ "$FAIL" -gt 0 ]; then
            echo "FAIL: $FAIL migration(s) failed."
            exit 1
          fi

      - name: Run seeds
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          FAIL=0
          for seed in $(ls supabase/seed/*.sql 2>/dev/null | sort); do
            fname=$(basename "$seed")
            if PGPASSWORD=verify_pass psql -h localhost -U postgres -d h2a_verify -v ON_ERROR_STOP=1 -1 < "$seed" >/dev/null 2>&1; then
              echo "  ok   $fname"
            else
              echo "  FAIL $fname"
              PGPASSWORD=verify_pass psql -h localhost -U postgres -d h2a_verify -v ON_ERROR_STOP=1 -1 < "$seed" 2>&1 | grep -i "error\|hint" | head -3 || true
              FAIL=$((FAIL + 1))
            fi
          done
          if [ "$FAIL" -gt 0 ]; then
            echo "FAIL: $FAIL seed(s) failed."
            exit 1
          fi
          echo "ALL PASSED"

      - name: Verify consent canon (SPEC-031)
        if: steps.changes.outputs.has_changes == 'true'
        env:
          PGPASSWORD: verify_pass
        run: |
          PSQL="psql -h localhost -U postgres -d h2a_verify -v ON_ERROR_STOP=1 -t -A"
          FAIL=0

          echo "--- Consent-Typen speicherbar ---"
          $PSQL <<'SQL' >/dev/null
          INSERT INTO customer_profiles (id, mercedes_me_id, first_seen_at, identity_tier)
          VALUES ('00000000-0000-0000-0000-000000000001', 'ci-consent-verify', now(), 'anonymous')
          ON CONFLICT (id) DO NOTHING;
          SQL

          TYPES="ai_personalization memory_storage ai_autonomy profiling_art22 data_processing analytics data_retention cross_channel cross_device vehicle_data vehicle_control location_services marketing proactive_contact"
          for ct in $TYPES; do
            result=$($PSQL -c "INSERT INTO consent_records (customer_id, consent_type, granted, granted_at) VALUES ('00000000-0000-0000-0000-000000000001', '$ct', true, now()) RETURNING consent_type;" 2>&1 || true)
            if echo "$result" | grep -q "$ct"; then
              echo "  ok   $ct"
            else
              echo "  FAIL $ct: $result"
              FAIL=$((FAIL + 1))
            fi
          done

          STORED=$($PSQL -c "SELECT count(DISTINCT consent_type) FROM consent_records WHERE customer_id = '00000000-0000-0000-0000-000000000001';")
          echo "  Stored: $STORED (expected: 14)"
          [ "$STORED" -eq 14 ] || FAIL=$((FAIL + 1))

          echo "--- risk_level on agent_tools ---"
          HIGH=$($PSQL -c "SELECT count(*) FROM agent_tools WHERE risk_level = 'high';")
          ELEVATED=$($PSQL -c "SELECT count(*) FROM agent_tools WHERE risk_level = 'elevated';")
          echo "  high=$HIGH (expected 2), elevated=$ELEVATED (expected 2)"
          [ "$HIGH" -eq 2 ] || FAIL=$((FAIL + 1))
          [ "$ELEVATED" -eq 2 ] || FAIL=$((FAIL + 1))

          if [ "$FAIL" -gt 0 ]; then echo "FAIL: $FAIL check(s)"; exit 1; fi
          echo "CONSENT CANON PASSED"

      - name: Verify consent ordering (SPEC-035)
        if: steps.changes.outputs.has_changes == 'true'
        env:
          PGPASSWORD: verify_pass
        run: |
          PSQL="psql -h localhost -U postgres -d h2a_verify -v ON_ERROR_STOP=1 -t -A"
          CID="00000000-0000-0000-0000-000000000001"
          FAIL=0

          echo "--- seq column + index ---"
          SEQ_EXISTS=$($PSQL -c "SELECT column_name FROM information_schema.columns WHERE table_name='consent_records' AND column_name='seq';")
          if [ -z "$SEQ_EXISTS" ]; then
            echo "  skip  seq column not yet present (Migration 023 not in this branch)"
            echo "CONSENT ORDERING SKIPPED (no seq column)"
            exit 0
          fi
          echo "  ok   seq column"

          SEQ_DEFAULT=$($PSQL -c "SELECT column_default FROM information_schema.columns WHERE table_name='consent_records' AND column_name='seq';")
          echo "$SEQ_DEFAULT" | grep -qi "nextval" && echo "  ok   seq has auto-increment (nextval)" || { echo "  FAIL seq missing auto-increment: $SEQ_DEFAULT"; FAIL=$((FAIL+1)); }

          IDX=$($PSQL -c "SELECT indexname FROM pg_indexes WHERE tablename='consent_records' AND indexname='idx_consent_ordering';")
          [ -n "$IDX" ] && echo "  ok   idx_consent_ordering" || { echo "  FAIL index missing"; FAIL=$((FAIL+1)); }

          echo ""
          echo "--- Fall (a): revoked_at → gilt nicht ---"
          $PSQL <<SQL >/dev/null
          DELETE FROM consent_records WHERE customer_id = '$CID' AND consent_type = 'analytics';
          INSERT INTO consent_records (customer_id, consent_type, granted, granted_at, revoked_at)
          VALUES ('$CID', 'analytics', true, now(), now());
          SQL
          RESULT_A=$($PSQL -c "SELECT granted, revoked_at IS NOT NULL AS has_revoked FROM consent_records WHERE customer_id = '$CID' AND consent_type = 'analytics' ORDER BY seq DESC LIMIT 1;")
          echo "  raw: $RESULT_A"
          echo "$RESULT_A" | grep -qE "(t|true)" && echo "  ok   revoked_at present → gilt nicht" || { echo "  FAIL"; FAIL=$((FAIL+1)); }

          echo ""
          echo "--- Fall (b): granted=false → gilt nicht ---"
          $PSQL <<SQL >/dev/null
          DELETE FROM consent_records WHERE customer_id = '$CID' AND consent_type = 'marketing';
          INSERT INTO consent_records (customer_id, consent_type, granted, granted_at)
          VALUES ('$CID', 'marketing', false, now());
          SQL
          RESULT_B=$($PSQL -c "SELECT granted FROM consent_records WHERE customer_id = '$CID' AND consent_type = 'marketing' ORDER BY seq DESC LIMIT 1;")
          echo "  raw: $RESULT_B"
          echo "$RESULT_B" | grep -qE "^(f|false)" && echo "  ok   granted=false → gilt nicht" || { echo "  FAIL"; FAIL=$((FAIL+1)); }

          echo ""
          echo "--- Fall (c): Same-transaction seq ordering ---"
          $PSQL <<SQL >/dev/null
          DELETE FROM consent_records WHERE customer_id = '$CID' AND consent_type = 'cross_channel';
          SQL
          $PSQL -1 <<SQL >/dev/null
          BEGIN;
          INSERT INTO consent_records (customer_id, consent_type, granted, granted_at)
          VALUES ('$CID', 'cross_channel', true, now());
          INSERT INTO consent_records (customer_id, consent_type, granted, granted_at, revoked_at)
          VALUES ('$CID', 'cross_channel', true, now(), now());
          COMMIT;
          SQL
          ROWS_C=$($PSQL -c "SELECT granted, revoked_at IS NOT NULL AS has_revoked, seq FROM consent_records WHERE customer_id = '$CID' AND consent_type = 'cross_channel' ORDER BY seq DESC;")
          echo "  raw:"
          echo "$ROWS_C" | while IFS= read -r line; do echo "    $line"; done
          TS_CHECK=$($PSQL -c "SELECT count(DISTINCT granted_at) FROM consent_records WHERE customer_id = '$CID' AND consent_type = 'cross_channel';")
          echo "  distinct timestamps: $TS_CHECK (expected: 1 = same transaction)"
          LATEST_C=$($PSQL -c "SELECT revoked_at IS NOT NULL FROM consent_records WHERE customer_id = '$CID' AND consent_type = 'cross_channel' ORDER BY seq DESC LIMIT 1;")
          echo "$LATEST_C" | grep -qE "(t|true)" && echo "  ok   latest has revoked_at → gilt nicht" || { echo "  FAIL latest should be revoked"; FAIL=$((FAIL+1)); }

          echo ""
          echo "--- Fall (d): Re-grant nach Widerruf → gilt ---"
          $PSQL <<SQL >/dev/null
          DELETE FROM consent_records WHERE customer_id = '$CID' AND consent_type = 'data_retention';
          INSERT INTO consent_records (customer_id, consent_type, granted, granted_at, revoked_at)
          VALUES ('$CID', 'data_retention', true, now() - interval '1 hour', now() - interval '30 minutes');
          INSERT INTO consent_records (customer_id, consent_type, granted, granted_at)
          VALUES ('$CID', 'data_retention', true, now());
          SQL
          RESULT_D=$($PSQL -c "SELECT granted, revoked_at IS NULL AS no_revoke FROM consent_records WHERE customer_id = '$CID' AND consent_type = 'data_retention' ORDER BY seq DESC LIMIT 1;")
          echo "  raw: $RESULT_D"
          echo "$RESULT_D" | grep -qE "(t|true)\|(t|true)" && echo "  ok   re-grant → gilt" || { echo "  FAIL"; FAIL=$((FAIL+1)); }

          if [ "$FAIL" -gt 0 ]; then echo "FAIL: $FAIL check(s)"; exit 1; fi
          echo "CONSENT ORDERING PASSED"

      - name: Verify RLS on all public tables (SPEC-041)
        if: steps.changes.outputs.has_changes == 'true'
        env:
          PGPASSWORD: verify_pass
        run: |
          PSQL="psql -h localhost -U postgres -d h2a_verify -v ON_ERROR_STOP=1 -t -A"
          FAIL=0

          echo "--- RLS enforcement: every public table must have RLS enabled ---"
          TABLES_WITHOUT_RLS=$($PSQL -c "
            SELECT tablename FROM pg_tables
            WHERE schemaname = 'public'
              AND tablename NOT LIKE 'pg_%'
              AND tablename NOT IN (
                SELECT tablename FROM pg_tables t
                JOIN pg_class c ON c.relname = t.tablename
                WHERE t.schemaname = 'public' AND c.relrowsecurity = true
              )
            ORDER BY tablename;
          ")

          if [ -n "$TABLES_WITHOUT_RLS" ]; then
            echo "FAIL: Tables without RLS:"
            echo "$TABLES_WITHOUT_RLS" | while IFS= read -r t; do
              [ -n "$t" ] && echo "  ✘ $t" && FAIL=$((FAIL + 1))
            done
            echo "FAIL: RLS enforcement check failed."
            exit 1
          fi
          echo "  ok   all public tables have RLS enabled"
          echo "RLS ENFORCEMENT PASSED"

      - name: Verify RLS denies anon and authenticated (SPEC-041)
        if: steps.changes.outputs.has_changes == 'true'
        env:
          PGPASSWORD: verify_pass
        run: |
          PSQL="psql -h localhost -U postgres -d h2a_verify -v ON_ERROR_STOP=1 -t -A"
          FAIL=0
          CONFIG_TABLES="model_config agent_tools ccp_personalities ccp_routing_rules ccp_deployments cost_gate_config degradation_config enrichment_cache"

          echo "--- G1: RLS blocks SELECT (returns 0 rows, not permission denied) ---"
          for role in anon authenticated; do
            echo "  role: $role"
            for tbl in $CONFIG_TABLES; do
              ROW_COUNT=$($PSQL -c "SET ROLE $role; SELECT count(*) FROM $tbl;" 2>&1 || true)
              $PSQL -c "RESET ROLE;" >/dev/null 2>&1
              if echo "$ROW_COUNT" | grep -qE "^0$"; then
                echo "    ok   $tbl → 0 rows"
              elif echo "$ROW_COUNT" | grep -qi "permission denied"; then
                echo "    ok   $tbl → permission denied"
              else
                echo "    FAIL $tbl → $ROW_COUNT"
                FAIL=$((FAIL + 1))
              fi
            done
          done

          echo ""
          echo "--- G1 negative test: service_role bypasses RLS ---"
          $PSQL -c "RESET ROLE;" >/dev/null 2>&1
          SVC_COUNT=$($PSQL -c "SET LOCAL ROLE service_role; SELECT count(*) FROM model_config;" 2>&1 | grep -E '^[0-9]+$' | head -1 || true)
          $PSQL -c "RESET ROLE;" >/dev/null 2>&1
          if [ -n "$SVC_COUNT" ] && [ "$SVC_COUNT" -gt 0 ] 2>/dev/null; then
            echo "  ok   service_role can SELECT model_config ($SVC_COUNT rows)"
          else
            echo "  FAIL service_role should see rows in model_config: $SVC_COUNT"
            FAIL=$((FAIL + 1))
          fi

          echo ""
          echo "--- G2: Functions not executable by anon/authenticated ---"
          for role in anon authenticated; do
            RESULT=$($PSQL -c "SET ROLE $role; SELECT * FROM increment_session_cost('test', 0.01);" 2>&1 || true)
            $PSQL -c "RESET ROLE;" >/dev/null 2>&1
            if echo "$RESULT" | grep -qi "permission denied"; then
              echo "  ok   $role cannot execute increment_session_cost"
            else
              echo "  FAIL $role CAN execute increment_session_cost: $RESULT"
              FAIL=$((FAIL + 1))
            fi
          done

          echo ""
          echo "--- G2: p_cost_delta < 0 rejected ---"
          $PSQL -c "RESET ROLE;" >/dev/null 2>&1
          NEG_RESULT=$($PSQL -c "SET ROLE service_role; SELECT * FROM increment_session_cost('nonexistent', -1.0);" 2>&1 || true)
          $PSQL -c "RESET ROLE;" >/dev/null 2>&1
          if echo "$NEG_RESULT" | grep -qi "must be >= 0"; then
            echo "  ok   negative cost delta rejected"
          else
            echo "  FAIL negative cost delta NOT rejected: $NEG_RESULT"
            FAIL=$((FAIL + 1))
          fi

          echo ""
          echo "--- Testing view: session_cost_stats ---"
          for role in anon authenticated; do
            RESULT=$($PSQL -c "SET ROLE $role; SELECT * FROM session_cost_stats;" 2>&1 || true)
            $PSQL -c "RESET ROLE;" >/dev/null 2>&1
            if echo "$RESULT" | grep -qi "permission denied"; then
              echo "  ok   $role cannot SELECT session_cost_stats"
            else
              echo "  FAIL $role CAN SELECT session_cost_stats: $RESULT"
              FAIL=$((FAIL + 1))
            fi
          done

          if [ "$FAIL" -gt 0 ]; then echo "FAIL: $FAIL role-check(s)"; exit 1; fi
          echo "ROLE CHECKS PASSED"

      - name: Verify no function EXECUTE for public/anon/authenticated (G3)
        if: steps.changes.outputs.has_changes == 'true'
        env:
          PGPASSWORD: verify_pass
        run: |
          PSQL="psql -h localhost -U postgres -d h2a_verify -v ON_ERROR_STOP=1 -t -A"
          FAIL=0
          ALLOWED_FUNCTIONS=""

          echo "--- G3: No function in public with EXECUTE for PUBLIC, anon, or authenticated ---"
          LEAKED=$($PSQL -c "
            SELECT p.proname, r.rolname
            FROM pg_proc p
            JOIN pg_namespace n ON n.oid = p.pronamespace
            CROSS JOIN LATERAL (
              SELECT rolname FROM pg_roles
              WHERE rolname IN ('anon', 'authenticated')
              UNION ALL
              SELECT 'PUBLIC'
            ) r(rolname)
            WHERE n.nspname = 'public'
              AND p.proname NOT IN (SELECT unnest(string_to_array('$ALLOWED_FUNCTIONS', ',')))
              AND has_function_privilege(
                CASE WHEN r.rolname = 'PUBLIC' THEN 'PUBLIC' ELSE r.rolname END,
                p.oid,
                'EXECUTE'
              );
          ")

          if [ -n "$LEAKED" ]; then
            echo "FAIL: Functions with EXECUTE grants that should not exist:"
            echo "$LEAKED" | while IFS='|' read -r fname rname; do
              [ -n "$fname" ] && echo "  ✘ $fname → $rname" && FAIL=$((FAIL + 1))
            done
            exit 1
          fi
          echo "  ok   no leaked EXECUTE privileges"
          echo "FUNCTION EXECUTE CHECK PASSED"

      - name: Verify migration immutability (SPEC-041)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          FAIL=0
          echo "--- Migration immutability: no changes to migrations already on main ---"

          CHANGED_MIGRATIONS=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- supabase/migrations/ | while IFS= read -r f; do
            [ -z "$f" ] && continue
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then
              echo "$f"
            fi
          done)

          if [ -n "$CHANGED_MIGRATIONS" ]; then
            echo "FAIL: These migrations exist on main and were modified:"
            echo "$CHANGED_MIGRATIONS" | while IFS= read -r m; do
              [ -n "$m" ] && echo "  ✘ $m"
            done
            echo "Existing migrations must not be altered. Add a new migration instead."
            exit 1
          fi
          echo "  ok   no existing migrations modified"
          echo "MIGRATION IMMUTABILITY PASSED"
