name: tests

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run -r test

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno type-check Edge Function
        run: deno check --no-npm --config supabase/functions/deno.json supabase/functions/h2a/index.ts
