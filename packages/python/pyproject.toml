[project]
name = "h2a"
version = "0.1.0"
description = "H2A Protocol — Python server library for agent backends"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["h2a", "human-to-agent", "protocol", "ai", "agent"]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "ruff>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100
